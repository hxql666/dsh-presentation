# Publish to npm from CI, with no stored token and no one-time code.
#
# Why this exists rather than `npm publish` on a laptop:
#
#   npm requires an interactive 2FA challenge to publish. That means either an
#   authenticator app on every release, or a granular access token with 2FA
#   bypass — and npm has already announced that bypass tokens lose direct publish
#   (targeted January 2027), pointing at trusted publishing instead.
#
#   Trusted publishing replaces the token with OIDC: the registry verifies that
#   the workflow really ran in this repository, at this path, on this trigger.
#   There is no secret in the repository, nothing to rotate, and no code to read
#   out of an app — which is also why this workflow sets no NODE_AUTH_TOKEN.
#
# One-time setup before this can work:
#
#   1. Publish the package once interactively so it exists — npm only lets you
#      register a trusted publisher for a package that already exists. Use an
#      authenticator app, or `npm stage publish` followed by an approval.
#   2. On npmjs.com, for @hxql/dsh-presentation: Settings -> Trusted Publisher
#      -> GitHub Actions, and enter
#          Organization or user: hxql666
#          Repository:          dsh-presentation
#          Workflow filename:   publish.yml
#          Environment:         (leave blank)
#
# After that, run this workflow (Actions -> Publish to npm -> Run workflow) and the
# package goes out with provenance.
#
# There is one package. An earlier release had two — a plugin and a separate preset
# package — and this workflow still packed and published both after they were merged,
# which would have failed on the second publish. Keep the release steps and the
# workspace list in step.
name: Publish to npm

on:
  # Manual: the normal path, so releasing is a deliberate act.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and verify without publishing'
        type: boolean
        default: false
  # Tagging a release also publishes.
  release:
    types: [published]

# OIDC needs id-token: write. Everything else is read-only.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 is the floor for npm's trusted publishing flow.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # The plugin declares its Typst binaries as optional platform dependencies.
      # They are needed only to run the suite below, and CI is Linux x64, so exactly
      # one is fetched.
      - name: Install
        run: npm install --no-audit --no-fund

      # The suite opens with the type check, so a mistake in our own code or in a
      # JSDoc contract stops the release here.
      - name: Test
        run: npm test

      - name: Pack and show what would ship
        shell: bash
        run: |
          mkdir -p /tmp/pack
          npm pack --workspace=@hxql/dsh-presentation --pack-destination /tmp/pack
          echo '--- tarball ---'
          ls -la /tmp/pack
          tarball=$(ls /tmp/pack/*.tgz)
          echo '--- the vendored Typst package is present ---'
          tar -tzf "$tarball" | grep -c vendor/preview/touying/0.8.0/lib.typ
          echo '--- the preset patch is present ---'
          tar -tzf "$tarball" | grep -c cordis.patch.yml
          echo '--- nothing forbidden ---'
          if tar -tzf "$tarball" | grep -E 'node_modules/|\.test-output|\.pdf$|\.log$|\.tgz$'; then
            echo 'a forbidden path is in the tarball'
            exit 1
          fi
          echo 'clean'

      # No NODE_AUTH_TOKEN: the OIDC exchange authenticates the publish. npm reads
      # the id-token permission above and the trusted-publisher registration on the
      # package itself.
      - name: Publish @hxql/dsh-presentation
        if: ${{ inputs.dry-run != true }}
        run: npm publish --workspace=@hxql/dsh-presentation --access public --provenance
