# Run the suite on every push and pull request.
#
# Separate from `publish.yml`, which also runs the suite but only when a release is
# meant to go out. This one is the signal on ordinary changes — a red badge on the
# README, so a contributor can see whether their branch is healthy without asking.
#
# Three platforms on purpose. The plugin ships six platform-specific Typst binaries
# and resolves paths, junctions and case sensitivity differently per OS; Windows is
# where this was developed and Linux is where it publishes, so testing only one of
# them would leave the other unexercised. macOS is included because it is the third
# platform the package declares binaries for.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # A failure on one platform should not hide the result on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Root install brings the toolchain (TypeScript, Node types). The package's
      # own install fetches the Typst binary for this platform — an optional
      # dependency, so a platform without a published binary would silently skip it
      # and the suite would fail on the first build rather than at install.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Show which Typst the suite will use
        shell: bash
        run: |
          node -e "
          const path = require('path');
          const fs = require('fs');
          const dir = 'packages/dsh-presentation/node_modules/@flukxr';
          if (!fs.existsSync(dir)) { console.log('no @flukxr packages installed'); process.exit(0); }
          for (const name of fs.readdirSync(dir)) {
            const exe = path.join(dir, name, 'vendor', process.platform === 'win32' ? 'typst.exe' : 'typst');
            console.log(name, fs.existsSync(exe) ? 'binary present' : 'no binary');
          }
          "

      - name: Type check
        run: npx tsc -p tsconfig.json

      # One step per suite, so a failure is attributable. `npm test` chains them with
      # `&&`, which reports only "the chain failed" — on the first CI run that meant two
      # platforms were red with no way to tell which suite or why. Each failure also
      # becomes an annotation, which stays readable through the checks API without
      # downloading job logs.
      - name: Test each suite
        shell: bash
        run: |
          # Deliberately not `-e -o pipefail`, which is what `shell: bash` turns on by
          # default: a pipeline like `grep … | head` exits 1 when grep matches nothing,
          # and with pipefail that aborts the whole step — which is how the first version
          # of this loop failed on Ubuntu with no annotation emitted at all. Errors are
          # handled explicitly below instead.
          set +e
          set +o pipefail
          cd packages/dsh-presentation
          # No `mapfile` either: macOS ships bash 3.2, where it does not exist.
          suites=$(node -e "const j=require('./package.json');console.log(j.scripts.test.split(' && ').map(s=>s.replace(/^node test\//,'').replace(/\.mjs$/,'')).join(' '))")
          count=$(echo "$suites" | wc -w | tr -d ' ')
          echo "$count suites declared in package.json"
          failed=""
          for suite in $suites; do
            if node "test/$suite.mjs" > "$RUNNER_TEMP/$suite.log" 2>&1; then
              echo "ok    $suite"
            else
              echo "FAIL  $suite"
              # The reason goes into the annotation, so a failure is diagnosable from
              # the checks API alone. `%` is escaped because it is syntax in a workflow
              # command; a missing match must not abort the step.
              detail=$( (grep -E '^  FAIL|Error|error:' "$RUNNER_TEMP/$suite.log" || true) | head -n 5 | tr '\n' '|' | sed 's/%/%25/g')
              echo "::error title=suite:$suite (${{ matrix.os }})::${detail:-test/$suite.mjs failed; see the step log}"
              echo "--- tail of $suite ---"
              tail -n 30 "$RUNNER_TEMP/$suite.log"
              failed="$failed $suite"
            fi
          done
          if [ -n "$failed" ]; then
            {
              echo "### Failed suites on ${{ matrix.os }}"
              for suite in $failed; do echo "- \`$suite\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "failed:$failed"
            exit 1
          fi
          echo "every suite passed"

  # The published artifact is what a stranger installs, so it gets its own check:
  # the tarball must contain the vendored Typst package and nothing that should not
  # ship.
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Pack and inspect
        shell: bash
        run: |
          mkdir -p /tmp/pack
          npm pack --workspace=@hxql/dsh-presentation --pack-destination /tmp/pack
          ls -la /tmp/pack
          tarball=$(ls /tmp/pack/*.tgz)

          echo '--- the vendored Touying package must be inside ---'
          tar -tzf "$tarball" | grep -c vendor/preview/touying/0.8.0/lib.typ

          echo '--- the browser preset patch must be inside ---'
          tar -tzf "$tarball" | grep -c cordis.patch.yml

          echo '--- nothing forbidden ---'
          if tar -tzf "$tarball" | grep -E 'node_modules/|\.test-output|\.pdf$|\.log$|\.tgz$'; then
            echo 'a forbidden path is in the tarball'
            exit 1
          fi
          echo 'clean'
